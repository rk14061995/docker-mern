services:
  mongodb:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_password
    secrets:
      - mongo_password
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username admin --password \"$$(cat /run/secrets/mongo_password)\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  backend:
    image: "rk14061995/${BACKEND_IMAGE}:${IMAGE_TAG}"
    expose:
      - "5000"
    environment:
      PORT: 5000
      MONGO_USERNAME: admin
      MONGO_PASSWORD_FILE: /run/secrets/mongo_password
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB: tasks_new
      MONGO_AUTH_SOURCE: admin
    secrets:
      - mongo_password
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5000/health').then(r => {if(!r.ok) process.exit(1)}).catch(err => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    image: "rk14061995/${FRONTEND_IMAGE}:${IMAGE_TAG}"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5173').then(r => {if(!r.ok) process.exit(1)}).catch(err => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mongo-data:

secrets:
  mongo_password:
    file: ./secrets/mongo_password.txt
