services:
  mongodb:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_password
    secrets:
      - mongo_password
    tmpfs:
      - data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quite --username admin --password \"$$(cat /run/secrets/mongo_password)\" --authenticationDatabase admin --eval \"ok.adminCommand('ping').ok \" | grep 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10a
  
  backend:
    image: "${BACKEND_IMAGE}:${IMAGE_TAG}"
    environment:
      PORT: 5000
      MONGO_USERNAME: admin
      MONGO_PASSWORD_FILE: /run/secrets/mongo_password
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB: tasks_ci
      MONGO_AUTH_SOURCE: admin
    secrets:
      - mongo_password
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "featch('http://localhost:5000').then(r => {if(!r.ok) process.exit(1)}).catch(err => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    image: "${FRONTEND_IMAGE}:${IMAGE_TAG}"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "-e",
          "fetch('http://localhost:5173').then(r => {if(!r.ok) process.exit(1)}).catch(err => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  
  secrets:
    mongo_password:
      file: ./.ci-mongo-password
