services:
  mongodb:
    image:  mongo:latest
    container_name: task-mongodb
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_password
    secrets:
      - mongo_password
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
         [
           "CMD-SHELL",
           "mongosh --quiet --username admin --password \"$$(cat /run/secrets/mongo_password)\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"
         ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  backend:
    build:
      context: ./backend
    image: mern-task-backend:${APP_VERSION:-1.0.0}
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
        order: stop-first
    #ports:
     # - "${BACKEND_PORT}:5000"
    expose:
      - "5000"
    environment:
      PORT: ${BACKEND_PORT}
      MONGO_USERNAME: admin
      MONGO_DB: ${MONGO_DB}
      MONGO_PASSWORD_FILE: /run/secrets/mongo_password
    secrets:
      - mongo_password
    depends_on:
      mongodb:
          condition: service_healthy
    healthcheck:
        test:
           [
            "CMD",
            "node",
            "-e",
            "fetch('http://localhost:${BACKEND_PORT}/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
           ]
  frontend:
    image: mern-task-frontend:${APP_VERSION:-1.0.0}
    build:
      context: ./frontend
    container_name: task-frontend
    ports:
      - "${FRONTEND_PORT}:5173"
    depends_on:
      backend:
         condition: service_healthy
volumes:
  mongo-data:

secrets:
  mongo_password:
    file: ./secrets/mongo_password.txt
